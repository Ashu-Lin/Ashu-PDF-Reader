[package]
name = "ashu-pdf-reader"
version = "0.1.3"
description = "A minimal Windows-first PDF reader."
authors = ["Ashu"]
edition = "2021"

[lib]
name = "ashu_pdf_reader_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true



